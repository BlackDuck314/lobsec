[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobsec-scraper"
version = "1.0.0"
description = "General-purpose web scraping engine for the lobsec ecosystem"
requires-python = ">=3.11"
dependencies = [
    "crawlee[playwright]",
    "patchright",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "httpx",
    "tenacity",
    "structlog",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ninja-scraper = "ninja_scraper.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ninja_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
