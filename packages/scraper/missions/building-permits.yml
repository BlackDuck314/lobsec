# Dubai Building Permits — Dubai Pulse CSV Download
# Source 3 (COLL-03): 12-24 month leading indicator for supply delivery
# Signal: LEADING (12-24 months) | Lifecycle: Supply Pipeline

schema_version: "1.0"
name: building-permits
description: >
  Dubai Municipality building permits from Dubai Pulse open data.
  Residential permit counts are a 12-24 month leading indicator for supply
  delivery. Classify by residential vs commercial. Track permit withdrawal
  or expiry as a supply deflation signal.
type: http_download
frequency: monthly
priority: 2

source:
  url: "https://www.dubaipulse.gov.ae/data/dm-building-permits/dm_building_permits-open"
  method: GET
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "text/csv, application/csv, text/plain, */*"
    Accept-Language: "en-US,en;q=0.9"

extraction:
  format: csv
  encoding: utf-8
  fields:
    - permit_type
    - building_type
    - usage
    - project_type
    - area_name
    - issue_date

output:
  path: "/opt/lobsec/data/raw/building-permits/{date}.csv"
  format: csv

retry:
  max_attempts: 3
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: false

timeout_ms: 120000
