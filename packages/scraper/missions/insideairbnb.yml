# InsideAirbnb STR Listings — HTTP CSV Bulk Download
# Source 19 (COLL-19): Short-term rental occupancy proxy for Dubai
# Signal: LEADING (1-3 months) | Lifecycle: Housing Search / Investment

schema_version: "1.0"
name: insideairbnb
description: >
  InsideAirbnb quarterly CSV download for Dubai short-term rental listings.
  Provides STR occupancy proxy (low availability_365 = high demand), average
  nightly prices, and commercial host concentration (multihost ratio).
  Quarterly bulk download is gzipped CSV. Graceful failure if Dubai dataset
  not available for the current quarter.
type: http_download
frequency: quarterly
priority: 2

source:
  url: "http://data.insideairbnb.com/united-arab-emirates/dubai/dubai/data/listings.csv.gz"
  method: GET
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/gzip, text/csv, application/csv, */*"
    Accept-Language: "en-US,en;q=0.9"
    Referer: "http://insideairbnb.com/get-the-data/"

extraction:
  format: csv
  encoding: utf-8
  compression: gzip
  fields:
    - id
    - name
    - neighbourhood_cleansed
    - room_type
    - price
    - availability_365
    - reviews_per_month
    - calculated_host_listings_count
    - number_of_reviews_ltm
    - minimum_nights

output:
  path: "/opt/lobsec/data/raw/insideairbnb/{date}.csv.gz"
  format: csv

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000

proxy: false
user_agent_rotation: false
