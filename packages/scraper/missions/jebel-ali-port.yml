# Jebel Ali Port / DP World Cargo — Container & Cargo Throughput from Press Releases
# Source (COLL-20): Container throughput (TEU), cargo tonnes
# Signal: LEADING (2-3 months) | Lifecycle: Construction Supply Chain
#
# Strategy: DP World embeds an RSS feed (446 items) in __NEXT_DATA__ JSON on their
# news/releases page. We download the HTML, then ingest_raw.py parses the embedded
# RSS, filters for Jebel Ali / throughput releases, and extracts metrics from
# title + subtitle fields. No browser needed.

schema_version: "1.0"
name: jebel-ali-port
description: >
  DP World press release RSS feed extraction for Jebel Ali Port throughput data.
  Downloads the news/releases page (Next.js SSR), extracts embedded RSS feed from
  __NEXT_DATA__, filters for Jebel Ali container/cargo volume releases, and parses
  TEU + tonnage figures from titles and subtitles.
type: http_download
frequency: quarterly
priority: 2

source:
  url: "https://www.dpworld.com/en/news/releases"
  method: GET
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.9"

extraction:
  format: html
  fields:
    - container_throughput_teu
    - cargo_volume_tonnes
    - breakbulk_tonnes
    - yoy_growth_pct

output:
  path: "/opt/lobsec/data/raw/jebel-ali-port/{date}.html"
  format: html

retry:
  max_attempts: 3
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

proxy: false
user_agent_rotation: false
timeout_ms: 60000
