# ADREC Abu Dhabi — Browser Scrape with Table Extraction
# Source 4 (COLL-04): Abu Dhabi transaction data via ADREC public dashboards
# Signal: COINCIDENT | Lifecycle: Settlement / Transaction
# Selectors verified via DOM inspection 2026-03-16
# NOTE: DARI/UAE Pass authentication permanently abandoned per user decision.
#       ADREC public dashboards provide transaction, lease, and price index
#       data without authentication. COLL-04 fulfilled by ADREC substitution.

schema_version: "1.0"
name: adrec-abu-dhabi
description: >
  Abu Dhabi Real Estate Centre (ADREC) public dashboard data.
  Uses Patchright stealth browser to navigate the ADREC dashboard and extract
  the sales transaction table (#salesTable) which contains Asset Type,
  Property Type, Registration date, Sold Area, Plot Area, Rate/sqm, Layout,
  District, Sub-area, Project, Price, Completion%, Status, and Market Type.
  Also extracts summary KPI cards (total value and volume).
type: browser_scrape
frequency: monthly
priority: 2

source:
  url: "https://www.dari.ae/adrec/MarketDetails.html"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 8000
  wait_for_selector: '#salesTable'

extraction:
  format: json
  container_selector: '#salesTable tbody tr'
  selectors:
    asset_type: 'td:nth-child(1)'
    property_type: 'td:nth-child(2)'
    registration_date: 'td:nth-child(3)'
    sold_area_sqm: 'td:nth-child(4)'
    plot_area_sqm: 'td:nth-child(5)'
    rate_per_sqm: 'td:nth-child(6)'
    layout: 'td:nth-child(7)'
    district: 'td:nth-child(8)'
    sub_area: 'td:nth-child(9)'
    project: 'td:nth-child(10)'
    price: 'td:nth-child(11)'
    completion_pct: 'td:nth-child(12)'
    status: 'td:nth-child(13)'
    market_type: 'td:nth-child(14)'
  page_selectors:
    total_txn_value: 'h3:has-text("Total Transactional Value") + div'
    total_txn_volume: 'h3:has-text("Total Transactional Volume") + div'
  fields:
    - asset_type
    - property_type
    - registration_date
    - sold_area_sqm
    - plot_area_sqm
    - rate_per_sqm
    - layout
    - district
    - sub_area
    - project
    - price
    - completion_pct
    - status
    - market_type

output:
  path: "/opt/lobsec/data/raw/adrec-abu-dhabi/{date}.json"
  format: json

retry:
  max_attempts: 2
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000
