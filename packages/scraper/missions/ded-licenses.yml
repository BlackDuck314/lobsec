# DED Business Licenses — Monthly New & Cancelled Licenses by Sector
# Source (COLL-23): New licenses, cancelled licenses, breakdown by sector/type
# Signal: LEADING (1-3 months) | Lifecycle: Business Activity

schema_version: "1.0"
name: ded-licenses
description: >
  DED (Dubai Department of Economy and Development) business license statistics
  via Dubai Pulse. Browser scrape to bypass WAF that blocks HTTP downloads.
  Extract monthly new license issuances and cancellations/suspensions broken
  down by sector (real estate, hospitality, trading, professional services).
  Same approach as rta-vehicles for Dubai Pulse WAF bypass.
type: browser_scrape
frequency: monthly
priority: 2

source:
  url: "https://www.dubaipulse.gov.ae/data/ded-business-licenses"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    data_table: "table, .data-table, [class*='table'], [class*='dataset']"
    pagination: "[class*='pagination'], .page-controls"
    filter_controls: "[class*='filter'], [class*='sector'], [class*='type']"
  fields:
    - new_licenses
    - cancelled_licenses
    - sector
    - license_type

output:
  path: "/opt/lobsec/data/raw/ded-licenses/{date}.json"
  format: json

retry:
  max_attempts: 2
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

proxy: false
user_agent_rotation: false
timeout_ms: 300000
