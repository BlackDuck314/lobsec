# Hays Salary Survey — PDF Download
# Source: COLL-12 (Salary Surveys) | Signal: LAGGING (annual baseline) | Lifecycle: Employment

schema_version: "1.0"
name: hays-salary
description: >
  Hays UAE annual salary guide PDF download. Major global recruitment firm with
  detailed UAE salary data. Navigate to salary guide page, find latest PDF, download.
  Normalization extracts median salaries by seniority via pdfplumber.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.hays.ae/salary-guide"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: pdf
  strategy: find_and_download
  selectors:
    pdf_links: "a[href$='.pdf'], a[href*='salary'], a[href*='guide']"
    filter_text: "Salary|Guide|UAE"
  fields:
    - pdf_url
    - report_year

output:
  path: "/opt/lobsec/data/raw/hays-salary/{date}.pdf"
  format: binary

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  skip_on_403: true
  skip_on_captcha: true

timeout_ms: 300000
