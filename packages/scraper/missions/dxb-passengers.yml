# DXB Airport Passengers — HTML Fact File Scrape
# Source 7 (COLL-07): Airport passenger traffic data (arrivals/departures)
# Signal: LEADING (1-2 months) | Lifecycle: Population Movement
# URL updated 2026-03-17: old URL 404'd, new fact file at media.dubaiairports.ae
# Data format changed: HTML with embedded stats, no longer PDF factsheet

schema_version: "1.0"
name: dxb-passengers
description: >
  Dubai International Airport (DXB) annual/quarterly passenger statistics from
  the media centre fact file page. The page contains inline HTML text with
  embedded statistics (total passengers, YoY growth, flight movements, load
  factor, top source markets, top destinations). No PDF download needed —
  data is extracted directly from the page text. Normalization handles
  both the raw JSON and the existing PDF pipeline.
type: browser_scrape
frequency: monthly
priority: 2

source:
  url: "https://media.dubaiairports.ae/dubai-airports-main-fact-file/"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 3000

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    # The fact file page has statistics embedded in paragraph text
    # and structured sections — extract all text content
    content_blocks: ".fact-file-content, .content-area, article, .main-content, main"
    stat_blocks: ".stat, .statistic, .number, .figure, [class*='stat'], [class*='number']"
    paragraphs: "p, li, h2, h3, h4, td"
  page_selectors:
    full_text: "main, article, .content, body"
  fields:
    - total_passengers
    - yoy_growth_pct
    - flight_movements
    - load_factor
    - top_source_markets
    - top_destinations
    - quarterly_passengers

output:
  path: "/opt/lobsec/data/raw/dxb-passengers/{date}.json"
  format: json

retry:
  max_attempts: 2
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000
