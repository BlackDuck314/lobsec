# CBUAE Mortgage Rates & Outstanding — Quarterly PDF Download
# Source (COLL-17): EIBOR, mortgage outstanding (AED), new mortgage count
# Signal: COINCIDENT | Lifecycle: Finance & Credit

schema_version: "1.0"
name: cbuae-mortgages
description: >
  CBUAE (Central Bank of UAE) mortgage and lending statistics. Navigate to
  statistics page, locate quarterly mortgage/lending report PDF, and download.
  PDF normalization extracts EIBOR rate, mortgage outstanding balance, and
  new mortgage count via pdfplumber. Same domain as cbuae-remittances mission.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.centralbank.ae/en/statistics"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: pdf
  strategy: browser_pdf_download
  selectors:
    pdf_links: "a[href$='.pdf'], .report-link, [class*='download']"
    mortgage_filter: "text*='Mortgage' | text*='Lending' | text*='EIBOR' | text*='Credit'"
  fields:
    - eibor_rate
    - mortgage_outstanding_aed
    - new_mortgage_count

output:
  path: "/opt/lobsec/data/raw/cbuae-mortgages/{date}.pdf"
  format: binary

retry:
  max_attempts: 2
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

proxy: false
user_agent_rotation: false
timeout_ms: 300000
