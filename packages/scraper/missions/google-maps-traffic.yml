# Google Maps Popular Times — Foot Traffic Index for 50 Dubai Locations
# Source 26 (COLL-26): Foot traffic as economic activity proxy
# Signal: COINCIDENT | Lifecycle: Housing Search / Economic Activity

schema_version: "1.0"
name: google-maps-traffic
description: >
  Weekly browser scrape of Google Maps Popular Times for 50 curated Dubai
  locations (malls, metro stations, landmarks, business districts, residential
  hubs). Extracts weekly popularity histogram (7 days x 24 hours, 0-100 index)
  embedded as JSON in Google Maps page source. Foot traffic aggregates by
  category provide economic activity proxy signals.

  STEALTH: 10-15 minute delay between locations (drip-feed across ~10 hours)
  to minimize Google detection. Proxy + UA rotation enabled.
  Single attempt per location — do not retry on block, move to next location.
type: browser_scrape
frequency: weekly
priority: 3

source:
  url: "https://www.google.com/maps/place/"
  browser: chromium
  stealth: true
  wait_until: networkidle

areas:
  # === MALLS (10) ===
  - "https://www.google.com/maps/place/The+Dubai+Mall/"
  - "https://www.google.com/maps/place/Mall+of+the+Emirates/"
  - "https://www.google.com/maps/place/Ibn+Battuta+Mall/"
  - "https://www.google.com/maps/place/Dubai+Marina+Mall/"
  - "https://www.google.com/maps/place/City+Centre+Deira/"
  - "https://www.google.com/maps/place/City+Centre+Mirdif/"
  - "https://www.google.com/maps/place/Nakheel+Mall/"
  - "https://www.google.com/maps/place/Dragon+Mart/"
  - "https://www.google.com/maps/place/Festival+City+Mall+Dubai/"
  - "https://www.google.com/maps/place/BurJuman+Centre/"
  # === METRO STATIONS (10) ===
  - "https://www.google.com/maps/place/Burj+Khalifa+Dubai+Mall+Metro+Station/"
  - "https://www.google.com/maps/place/Mall+of+the+Emirates+Metro+Station/"
  - "https://www.google.com/maps/place/Dubai+Marina+Metro+Station/"
  - "https://www.google.com/maps/place/DMCC+Metro+Station/"
  - "https://www.google.com/maps/place/Business+Bay+Metro+Station/"
  - "https://www.google.com/maps/place/Union+Metro+Station+Dubai/"
  - "https://www.google.com/maps/place/Deira+City+Centre+Metro+Station/"
  - "https://www.google.com/maps/place/Creek+Metro+Station+Dubai/"
  - "https://www.google.com/maps/place/Jumeirah+Lake+Towers+Metro+Station/"
  - "https://www.google.com/maps/place/Expo+2020+Metro+Station/"
  # === KEY AREAS / LANDMARKS (15) ===
  - "https://www.google.com/maps/place/Downtown+Dubai/"
  - "https://www.google.com/maps/place/Dubai+Marina+Walk/"
  - "https://www.google.com/maps/place/Jumeirah+Beach+Residence/"
  - "https://www.google.com/maps/place/DIFC+Gate+Village/"
  - "https://www.google.com/maps/place/Al+Barsha/"
  - "https://www.google.com/maps/place/Jumeirah+Village+Circle/"
  - "https://www.google.com/maps/place/Business+Bay+Dubai/"
  - "https://www.google.com/maps/place/Deira+Gold+Souk/"
  - "https://www.google.com/maps/place/Al+Quoz+Creative+District/"
  - "https://www.google.com/maps/place/Dubai+Silicon+Oasis/"
  - "https://www.google.com/maps/place/Palm+Jumeirah/"
  - "https://www.google.com/maps/place/Arabian+Ranches+Dubai/"
  - "https://www.google.com/maps/place/Dubai+Hills+Mall/"
  - "https://www.google.com/maps/place/Bluewaters+Island+Dubai/"
  - "https://www.google.com/maps/place/La+Mer+Dubai/"
  # === BUSINESS DISTRICTS (10) ===
  - "https://www.google.com/maps/place/Dubai+International+Financial+Centre/"
  - "https://www.google.com/maps/place/Dubai+Internet+City/"
  - "https://www.google.com/maps/place/Dubai+Media+City/"
  - "https://www.google.com/maps/place/Jebel+Ali+Free+Zone/"
  - "https://www.google.com/maps/place/Dubai+Design+District/"
  - "https://www.google.com/maps/place/Dubai+Healthcare+City/"
  - "https://www.google.com/maps/place/Al+Quoz+Industrial+Area/"
  - "https://www.google.com/maps/place/TECOM+Dubai/"
  - "https://www.google.com/maps/place/Dubai+South/"
  - "https://www.google.com/maps/place/Dubai+Studio+City/"
  # === RESIDENTIAL HUBS (5) ===
  - "https://www.google.com/maps/place/Discovery+Gardens+Dubai/"
  - "https://www.google.com/maps/place/International+City+Dubai/"
  - "https://www.google.com/maps/place/Dubai+Sports+City/"
  - "https://www.google.com/maps/place/Mirdif+Dubai/"
  - "https://www.google.com/maps/place/Al+Nahda+Dubai/"

extraction:
  format: json
  strategy: find_script_json
  selectors:
    popular_times_script: "script:has-text('popularTimesHistogram'), script:has-text('popularTimes')"
    current_popularity: ".section-popular-times-live-crumb, [data-popular-times]"
    place_name: "h1.DUwDvf, .fontHeadlineLarge"
    place_id: "link[rel='canonical']"
  fields:
    - location_name
    - place_id
    - popular_times
    - current_popularity
    - source_url

output:
  path: "/opt/lobsec/data/raw/google-maps-traffic/{date}.json"
  format: json

concurrency:
  max_concurrent: 1
  delay_between_requests_ms: [600000, 900000]

retry:
  max_attempts: 1
  initial_delay_ms: 60000
  max_delay_ms: 120000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 3600000

proxy: true
user_agent_rotation: true
