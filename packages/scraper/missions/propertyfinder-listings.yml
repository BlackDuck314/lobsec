# PropertyFinder Listings — Browser Scrape with Area Iteration
# Source 5b (COLL-05): Cross-validation source for Bayut listings data
# Signal: LEADING (2-6 weeks) | Lifecycle: Housing Search
# Selectors verified via DOM inspection 2026-03-16

schema_version: "1.0"
name: propertyfinder-listings
description: >
  PropertyFinder property listings scraped via Patchright stealth browser.
  Uses slug-based URLs (no numeric area_id mapping needed). Same neighbourhoods
  as Bayut but with PropertyFinder-specific slugs for cross-validation.
  Identical output format enables direct comparison of listing counts, prices,
  and price reduction badges between portals. Registered independently from
  Bayut — can fail without affecting the other.
type: browser_scrape
frequency: weekly
priority: 3

source:
  url: "https://www.propertyfinder.ae/en/buy/dubai/properties-for-sale-{area}.html"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 5000
  wait_for_selector: '[data-testid="property-card"]'

areas:
  - palm-jumeirah
  - downtown-dubai
  - dubai-marina
  - jumeirah-village-circle
  - business-bay
  - dubai-hills-estate
  - jumeirah-beach-residence
  - jumeirah-lake-towers
  - dubai-silicon-oasis
  - dubai-sports-city
  - international-city
  - discovery-gardens
  - al-quoz
  - arabian-ranches
  - dubai-land
  - motor-city
  - meydan
  - dubai-south
  - damac-hills
  - mirdif

extraction:
  format: json
  container_selector: '[data-testid="property-card"]'
  selectors:
    property_type: '[data-testid="property-card-type"]'
    price: '[data-testid="property-card-price"]'
    bedrooms: '[data-testid="property-card-spec-bedroom"]'
    bathrooms: '[data-testid="property-card-spec-bathroom"]'
    area_sqft: '[data-testid="property-card-spec-area"]'
    price_per_sqft: '[data-testid="property-card-spec-price-per-area"]'
    location: '[data-testid="property-card-location"]'
    title: 'h3'
  page_selectors:
    listing_count: '[data-testid="property-search-h1-content-title"]'
  fields:
    - area
    - listing_count
    - property_type
    - price
    - bedrooms
    - bathrooms
    - area_sqft
    - price_per_sqft
    - location
    - title

output:
  path: "/opt/lobsec/data/raw/propertyfinder-listings/{date}.json"
  format: json

concurrency:
  max_concurrent: 2
  delay_between_requests_ms: [2000, 6000]

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  max_delay_ms: 30000
  backoff_multiplier: 3.0
  jitter: true
  skip_on_403: true

timeout_ms: 600000
