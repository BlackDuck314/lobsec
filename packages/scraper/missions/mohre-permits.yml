# MOHRE Work Permits — Labour Market Observatory Scrape
# Source 6 (COLL-06): Work permit issuance data by sector/nationality
# Signal: LEADING (2-3 months) | Lifecycle: Employment
# URL updated 2026-03-17: old URL 404'd (data-library/statistical-report.aspx)
# New source: observatory.mohre.gov.ae — launched Feb 2026 with dashboard data

schema_version: "1.0"
name: mohre-permits
description: >
  MOHRE Labour Market Observatory dashboard scrape. The observatory has
  multiple pages with embedded Chart.js data and animated counters showing:
  - Workforce growth % (indexed 2021-2025)
  - Establishment growth %
  - Skilled labour growth %
  - UAE nationals in private sector (absolute counts)
  - Economic sector distribution (% breakdown)
  The main page has headline growth metrics. The "holistic view" sub-page
  has detailed time-series and sector distribution data.
type: browser_scrape
frequency: monthly
priority: 2

source:
  url: "https://observatory.mohre.gov.ae/en/uae-labour-market-priorities/a-holistic-view-on-the-uae-labour-market"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 5000
  # Charts use animated counters — need JS to settle
  pre_extract_js: "await new Promise(r => setTimeout(r, 3000))"

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    # Dashboard cards with growth metrics
    stat_cards: ".card, [class*='stat'], [class*='counter'], [class*='metric'], [class*='growth']"
    chart_labels: "canvas, [class*='chart']"
    paragraphs: "p, li, h2, h3, h4, span, strong"
    tables: "table, [class*='table']"
  page_selectors:
    full_text: "main, article, .content, body"
  fields:
    - workforce_growth_pct
    - establishment_growth_pct
    - skilled_labour_growth_pct
    - female_skilled_growth_pct
    - nationals_private_sector
    - sector_distribution

output:
  path: "/opt/lobsec/data/raw/mohre-permits/{date}.json"
  format: json

retry:
  max_attempts: 2
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000
