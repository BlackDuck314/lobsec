# DSC Population Bulletin — Direct PDF Download
# Source (COLL-25): Population estimates by age, nationality, growth rate
# Signal: STRUCTURAL (annual) | Lifecycle: Demand Fundamentals
# URL updated 2026-03-17: old URL redirects to data.dubai portal
# New source: direct PDF download from dsc.gov.ae/Publication/
# Verified: 200 OK, PDF accessible without auth

schema_version: "1.0"
name: fcsa-demographics
description: >
  Dubai Statistics Centre (DSC) annual Population Bulletin PDF download.
  The bulletin contains population by nationality (national vs expat),
  gender distribution, age groups, and growth rates. Published annually
  (~Q1 for prior year). Direct HTTP download of the known PDF URL.
  Quarterly timer checks for new annual bulletin.
type: http_download
frequency: quarterly
priority: 2

source:
  url: "https://www.dsc.gov.ae/Publication/Population%20Bulletin%20Emirate%20of%20Dubai%20-%202024.pdf"
  method: GET
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/pdf,*/*"

extraction:
  format: binary
  fields:
    - pdf_content

output:
  path: "/opt/lobsec/data/raw/fcsa-demographics/{date}.pdf"
  format: binary

retry:
  max_attempts: 3
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

proxy: false
user_agent_rotation: false
timeout_ms: 60000
