# Robert Half Salary Survey — PDF Download
# Source: COLL-12 (Salary Surveys) | Signal: LAGGING (annual baseline) | Lifecycle: Employment

schema_version: "1.0"
name: roberthalf-salary
description: >
  Robert Half UAE annual salary guide PDF download. Specializes in finance, accounting,
  and tech roles with detailed compensation data. Navigate to salary guide page,
  find latest PDF, download. Normalization extracts median salaries via pdfplumber.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.roberthalf.ae/salary-guide"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: pdf
  strategy: find_and_download
  selectors:
    pdf_links: "a[href$='.pdf'], a[href*='salary'], a[href*='guide']"
    filter_text: "Salary|Guide|UAE|Dubai"
  fields:
    - pdf_url
    - report_year

output:
  path: "/opt/lobsec/data/raw/roberthalf-salary/{date}.pdf"
  format: binary

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  skip_on_403: true
  skip_on_captcha: true

timeout_ms: 300000
