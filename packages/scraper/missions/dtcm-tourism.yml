# DTCM Dubai Tourism — Monthly Hotel Occupancy & Visitor Statistics
# Source (COLL-18): Hotel occupancy %, visitor count, hotel revenue, avg stay
# Signal: LEADING (1-2 months) | Lifecycle: Economic Activity

schema_version: "1.0"
name: dtcm-tourism
description: >
  DTCM (Dubai Department of Tourism and Commerce Marketing) monthly tourism
  performance statistics. Scrape research and insights page for hotel occupancy
  rate, international visitor count, hotel establishment revenue, and average
  length of stay. Government source — browser scrape, graceful 403 handling.
type: browser_scrape
frequency: monthly
priority: 2

source:
  url: "https://www.dubaitourism.gov.ae/en/research-and-insights"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    data_table: "table, .data-table, [class*='table'], [class*='stats'], [class*='performance']"
    report_links: "a[href*='report'], a[href*='statistics'], a[href*='performance']"
    filter_controls: "[class*='filter'], [class*='year'], [class*='month']"
  fields:
    - hotel_occupancy_pct
    - visitor_count
    - hotel_revenue_aed
    - average_length_of_stay

output:
  path: "/opt/lobsec/data/raw/dtcm-tourism/{date}.json"
  format: json

retry:
  max_attempts: 2
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

proxy: false
user_agent_rotation: false
timeout_ms: 300000
