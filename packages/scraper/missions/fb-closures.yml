# F&B Closures — Google Maps + Zomato Permanently Closed Restaurants
# Source 21 (COLL-21): F&B business health proxy for demand signals
# Signal: LEADING (1-2 months) | Lifecycle: Housing Search / Economic Activity

schema_version: "1.0"
name: fb-closures
description: >
  Monthly scrape of permanently closed F&B establishments in Dubai via
  Google Maps search results and Zomato closed restaurants page.
  "Permanently closed" labels from Google Maps provide a reliable signal
  for F&B sector health, which correlates with commercial real estate demand
  in mixed-use and retail areas. Cross-validates Google Maps vs Zomato data.
  Proxy and UA rotation required — Google Maps aggressively detects bots.
type: browser_scrape
frequency: monthly
priority: 3

source:
  url: "https://www.google.com/maps/search/restaurants+permanently+closed+dubai/"
  browser: chromium
  stealth: true
  wait_until: networkidle

areas:
  - "https://www.google.com/maps/search/restaurants+permanently+closed+dubai+marina/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+downtown+dubai/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+dubai+deira/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+jlt+dubai/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+business+bay+dubai/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+jbr+dubai/"
  - "https://www.google.com/maps/search/restaurants+permanently+closed+al+barsha+dubai/"
  - "https://www.zomato.com/dubai/restaurants?filters=closed"

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    result_items: "[data-result-index], .section-result, .hfpxzc"
    place_name: ".qBF1Pd, .fontHeadlineSmall, [data-value]"
    closed_label: ".o0Svhf, [data-closed='true'], :has-text('Permanently closed')"
    area_label: ".W4Efsd, .rogA2c"
  fields:
    - restaurant_name
    - area
    - permanently_closed
    - last_updated
    - source_url

output:
  path: "/opt/lobsec/data/raw/fb-closures/{date}.json"
  format: json

concurrency:
  max_concurrent: 1
  delay_between_requests_ms: [10000, 20000]

retry:
  max_attempts: 2
  initial_delay_ms: 10000
  max_delay_ms: 60000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 600000

proxy: true
user_agent_rotation: true
