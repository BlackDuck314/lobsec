# Dubai Customs Household Imports — CBUAE / Dubai Customs Trade Statistics
# Source 22 (COLL-22): Household goods import volume as residency proxy
# Signal: LEADING (1-3 months) | Lifecycle: Commitment / Occupancy

schema_version: "1.0"
name: customs-imports
description: >
  Quarterly browser scrape of Dubai Customs and CBUAE foreign trade statistics
  for household goods and furniture imports. HS chapters: 94 (furniture,
  lighting, prefab buildings), 73 (iron/steel articles), 85 (electrical
  equipment for households). Rising imports of these categories signal
  new household formation — a direct proxy for residential occupancy.
  Dubai Customs publishes quarterly statistical reports on their portal.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.dubaicustoms.gov.ae/en/TradeStatistics/Pages/default.aspx"
  browser: chromium
  stealth: true
  wait_until: networkidle

areas:
  - "https://www.dubaicustoms.gov.ae/en/TradeStatistics/Pages/default.aspx"
  - "https://www.cbuae.gov.ae/en-GB/Pages/Statistics/Foreign-Trade-Statistics.aspx"

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    data_table: "table, .data-table, [class*='statistics']"
    download_link: "a[href*='.pdf'], a[href*='.xlsx'], a[href*='download']"
    hs_chapter: ":has-text('Chapter 94'), :has-text('furniture'), :has-text('household')"
    stat_value: "td:nth-child(2), .value, [class*='amount']"
  fields:
    - measurement_quarter
    - furniture_imports_aed
    - household_goods_imports_aed
    - total_imports_aed
    - report_period
    - source_url

output:
  path: "/opt/lobsec/data/raw/customs-imports/{date}.json"
  format: json

concurrency:
  max_concurrent: 1
  delay_between_requests_ms: [5000, 10000]

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000

proxy: false
user_agent_rotation: false
