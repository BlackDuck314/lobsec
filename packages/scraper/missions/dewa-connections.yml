# DEWA Annual Statistics — PDF Download via Browser Session
# Source 15 (COLL-15): Electricity connections, consumption, customers as occupancy proxy
# Signal: LEADING (1-2 months) | Lifecycle: Settlement
#
# The old press-releases URL was 404. DEWA publishes annual statistics PDFs at
# /en/about-us/strategy-excellence/annual-statistics. PDF downloads are behind
# Akamai WAF so we use browser PDF download (not HTTP GET).

schema_version: "1.0"
name: dewa-connections
description: >
  DEWA annual statistics PDF containing electricity/water connections, consumption,
  and customer data. Browser navigates to the statistics page and downloads the
  latest PDF via link click. PDF contains multi-year data on new connections,
  closures, electricity/water consumption — all proxies for occupancy and
  economic activity.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.dewa.gov.ae/en/about-us/strategy-excellence/annual-statistics"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 3000

extraction:
  format: pdf
  selectors:
    pdf_links: "a[href*='Annual-Statistics'][href*='.ashx']"
  keywords:
    - "statistics"
    - "2024"
    - "booklet"

output:
  path: "/opt/lobsec/data/raw/dewa-connections/{date}.pdf"
  format: pdf

retry:
  max_attempts: 2
  initial_delay_ms: 2000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 120000
