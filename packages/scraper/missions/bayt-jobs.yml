# Bayt Job Postings — Browser Scrape
# Source: COLL-11 (Job Postings) | Signal: LEADING (2-3 months) | Lifecycle: Job Search
# Selectors verified via DOM inspection 2026-03-16

schema_version: "1.0"
name: bayt-jobs
description: >
  Bayt UAE job postings scraped via Patchright stealth browser.
  Major job platform in MENA region with good salary disclosure rates.
  Extracts job listings with salary ranges for sector/seniority classification.
type: browser_scrape
frequency: weekly
priority: 3

source:
  url: "https://www.bayt.com/en/uae/jobs/"
  browser: chromium
  stealth: true
  wait_until: domcontentloaded
  post_load_wait_ms: 5000
  wait_for_selector: '[data-job-id]'

extraction:
  format: json
  container_selector: '[data-job-id]'
  selectors:
    job_title: 'h2 a'
    company: '.job-company-location-wrapper a.t-bold'
    location: '.job-company-location-wrapper .t-mute span'
    salary: '.jb-label-salary'
    career_level: '.jb-label-careerlevel'
    posted_date: '.jb-date span'
  page_selectors:
    total_count: '[data-automation-id="XJobsFound"]'
  fields:
    - total_count
    - job_title
    - company
    - salary
    - career_level
    - location
    - posted_date

pagination:
  strategy: click_next
  next_selector: '.pagination-next a'
  max_pages: 5
  wait_after_ms: 5000

output:
  path: "/opt/lobsec/data/raw/bayt-jobs/{date}.json"
  format: json

concurrency:
  max_concurrent: 1
  delay_between_requests_ms: [2000, 5000]

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  skip_on_403: true

timeout_ms: 600000
