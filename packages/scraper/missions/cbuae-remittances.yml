# CBUAE Remittance Outflows — Quarterly PDF Report Browser Scrape
# Source 13 (COLL-13): Personal/worker remittances from balance of payments
# Signal: LEADING (1-3 months) | Lifecycle: Economic Activity

schema_version: "1.0"
name: cbuae-remittances
description: >
  CBUAE (Central Bank of UAE) quarterly balance of payments report PDF.
  Navigate to statistics page, find latest report containing "Balance of
  Payments" or "Remittance" or "External", download PDF. Normalization
  extracts all tables via pdfplumber, filters for remittance data during
  normalization step.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.centralbank.ae/en/statistics"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: pdf
  strategy: find_and_download
  selectors:
    pdf_links: "a[href$='.pdf'], .report-link"
    bop_filter: "text*='Balance of Payments' | text*='Remittance' | text*='External' | text*='Quarterly'"
  fields:
    - pdf_url
    - report_quarter
    - report_year

output:
  path: "/opt/lobsec/data/raw/cbuae-remittances/{date}.pdf"
  format: binary

retry:
  max_attempts: 2
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000
