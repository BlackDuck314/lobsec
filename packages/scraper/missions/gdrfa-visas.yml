# GDRFA Visa Transactions — Quarterly PDF Report Browser Scrape
# Source 8 (COLL-08): Visa issuance and cancellation statistics
# Signal: LEADING (2-6 months) | Lifecycle: Employment/Population

schema_version: "1.0"
name: gdrfa-visas
description: >
  GDRFA (General Directorate of Residency and Foreigners Affairs) quarterly
  visa statistics PDF. Navigate to open data page, find latest quarterly
  report PDF with visa statistics, download it. Normalization extracts
  visa issuance/cancellation tables via pdfplumber.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.gdrfad.gov.ae/en/open-data"
  browser: chromium
  stealth: true
  wait_until: networkidle

extraction:
  format: pdf
  strategy: find_and_download
  selectors:
    pdf_links: "a[href$='.pdf'], .report-download"
    quarterly_filter: "text*='Quarterly' | text*='Statistics' | text*='Q1' | text*='Q2' | text*='Q3' | text*='Q4' | text*='Visa'"
  fields:
    - pdf_url
    - report_quarter
    - report_year

output:
  path: "/opt/lobsec/data/raw/gdrfa-visas/{date}.pdf"
  format: binary

retry:
  max_attempts: 2
  initial_delay_ms: 3000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 300000
