# Bayut Property Listings — Browser Scrape with Area Iteration
# Source 5 (COLL-05): Active listings for price/volume leading indicators
# Signal: LEADING (2-6 weeks) | Lifecycle: Housing Search

schema_version: "1.0"
name: bayut-listings
description: >
  Bayut property listings scraped via Patchright stealth browser.
  Iterates over top 20 Dubai areas, extracting listing count, asking prices,
  bedroom counts, square footage, and price reduction badges. Days on market
  (DOM) is a critical leading indicator - rising DOM precedes price drops by
  4-8 weeks. Price reduction detected from portal "Reduced" badge during
  scraping (single-scrape metric, not historical comparison).
type: browser_scrape
frequency: weekly
priority: 3

source:
  url: "https://www.bayut.com/for-sale/property/dubai/{area}/"
  browser: chromium
  stealth: true
  wait_until: networkidle

areas:
  - palm-jumeirah
  - downtown-dubai
  - dubai-marina
  - jvc
  - business-bay
  - dubai-hills
  - jbr
  - jlt
  - dubai-silicon-oasis
  - sports-city
  - international-city
  - discovery-gardens
  - al-quoz
  - arabian-ranches
  - dubailand
  - motor-city
  - meydan
  - dubai-south
  - damac-hills
  - mirdif

extraction:
  format: json
  selectors:
    listing_count: "[aria-label='Showing results'] span, .ca4245f3"
    property_cards: "[aria-label='Listing'], .d4560cac"
    price: "[aria-label='Price'], .f343d9ce"
    bedrooms: "[aria-label='Beds'], .b5002a0c"
    sqft: "[aria-label='Area'], .b5002a0c"
    reduced_badge: "[class*='reduced'], [class*='Reduced'], .price-reduction"
  fields:
    - area
    - listing_count
    - price
    - bedrooms
    - sqft
    - reduced

output:
  path: "/opt/lobsec/data/raw/bayut-listings/{date}.json"
  format: json

concurrency:
  max_concurrent: 2
  delay_between_requests_ms: [2000, 6000]

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  max_delay_ms: 30000
  backoff_multiplier: 3.0
  jitter: true
  skip_on_403: true

timeout_ms: 600000
