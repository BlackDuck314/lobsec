# Commercial Office Reports — JLL / CBRE / Savills Public Research Pages
# Source 28 (COLL-28): Grade A office market health for commercial RE signals
# Signal: LAGGING (1-3 months) | Lifecycle: Commitment / Settlement

schema_version: "1.0"
name: commercial-office-reports
description: >
  Quarterly browser scrape of public research summary pages from JLL, CBRE,
  and Savills websites for Dubai office market reports. Key metrics
  (vacancy rate, net absorption, prime rent, total stock) are published
  in summary tables and infographics even when full PDFs are gated.
  Three firms provide cross-validation — consensus across firms is more
  reliable than single-source. PDF download attempted if linked from page.
type: browser_scrape
frequency: quarterly
priority: 2

source:
  url: "https://www.jll.ae/en/trends-and-insights/research"
  browser: chromium
  stealth: true
  wait_until: networkidle

areas:
  - "https://www.jll.ae/en/trends-and-insights/research"
  - "https://www.cbre.ae/en/research-and-insights"
  - "https://www.savills.ae/research/"

extraction:
  format: json
  strategy: browser_table_extract
  selectors:
    research_cards: ".research-card, article, .insight-card, [class*='research']"
    report_title: "h2, h3, .card-title, [class*='title']"
    report_link: "a[href*='office'], a[href*='dubai'], a[href*='.pdf']"
    vacancy_text: ":has-text('vacancy'), :has-text('Vacancy')"
    absorption_text: ":has-text('absorption'), :has-text('Absorption')"
    rent_text: ":has-text('rent'), :has-text('AED'), :has-text('psf')"
    metric_value: ".metric-value, .stat-number, [class*='highlight'], strong"
    download_link: "a[href*='.pdf'], a[href*='download']"
  fields:
    - vacancy_rate_pct
    - absorption_sqft
    - prime_rent_aed_sqft
    - total_stock_sqft
    - report_source
    - report_date
    - pdf_url
    - source_url

output:
  path: "/opt/lobsec/data/raw/commercial-office-reports/{date}.json"
  format: json

concurrency:
  max_concurrent: 1
  delay_between_requests_ms: [5000, 10000]

retry:
  max_attempts: 2
  initial_delay_ms: 5000
  max_delay_ms: 30000
  backoff_multiplier: 2.0
  jitter: true
  skip_on_403: true

timeout_ms: 600000

proxy: false
user_agent_rotation: false
